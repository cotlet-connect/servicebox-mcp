[project]
name = "servicebox-mcp"
version = "1.1.0"
description = "Connect ServiceBox to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No ServiceBox API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["servicebox", "servicebox api", "servicebox mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/servicebox-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=servicebox"
Source = "https://github.com/cotlet-connect/servicebox-mcp"

[project.scripts]
servicebox-mcp = "servicebox_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"servicebox_agent.py" = "servicebox_agent.py"

[tool.hatch.build.targets.sdist]
include = ["servicebox_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
